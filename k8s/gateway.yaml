# The gateway keeps no data, so we can run as many copies as we like
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: bookshop-gateway:1.0
          ports:
            - containerPort: 5000
          env:
            - name: CATALOGUE_URL
              value: http://catalogue:5001
            - name: ORDERS_URL
              value: http://orders:5002
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 10
---
# Make the gateway reachable from outside the cluster, on port 30000
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30000
